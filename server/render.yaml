services:
  - type: web
    name: smartprice-api
    runtime: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install --production=false
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        value: https://smartprice.vercel.app
